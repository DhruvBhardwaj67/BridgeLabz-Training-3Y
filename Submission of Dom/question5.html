
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 750px;
            margin: 30px auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 80%;
            max-height: 80vh;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>My Image Gallery</h2>

<div class="gallery" id="gallery">

    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
    <img src="https://picsum.photos/id/1016/600/400" alt="Forest">
    <img src="https://picsum.photos/id/1018/600/400" alt="Nature">
    <img src="https://picsum.photos/id/1020/600/400" alt="River">
    <img src="https://picsum.photos/id/1024/600/400" alt="Animal">
    <img src="https://picsum.photos/id/1035/600/400" alt="Landscape">

</div>

<div class="modal" id="modal">

    <span class="close" id="close">&times;</span>

    <img id="preview" src="" alt="Preview">

</div>

<script>
const gallery = document.getElementById("gallery");

const modal = document.getElementById("modal");

const preview = document.getElementById("preview");

const closeBtn = document.getElementById("close");

// Open image preview
gallery.addEventListener("click", function(event) {

    if (event.target.tagName === "IMG") {

        preview.src = event.target.src;

        modal.style.display = "flex";
    }

});

// Clicking inside modal should not close it
preview.addEventListener("click", function(event) {
    event.stopPropagation();
});

// Close by clicking outside image
modal.addEventListener("click", function(event) {
    if (event.target === modal) {
        modal.style.display = "none";
    }
});

// Close button
closeBtn.addEventListener("click", function() {
    modal.style.display = "none";
});

</script>

</body>
</html>
