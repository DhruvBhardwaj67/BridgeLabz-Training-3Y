
<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
    <style>
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
        }
        .valid {
            border: 2px solid green;
        }
        .invalid {
            border: 2px solid red;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h2>Movie Ticket Booking</h2>

    <form id="bookingForm" novalidate>
        <input id="name" placeholder="Full Name">
        <div id="nameError" class="error"></div>

        <input id="email" type="email" placeholder="Email">
        <div id="emailError" class="error"></div>

        <input id="seats" type="number" placeholder="Seats (1-10)" min="1" max="10">
        <div id="seatsError" class="error"></div>

        <button type="submit">Book Tickets</button>
    </form>

    <div id="ticket"></div>

    <script>
        const form = document.getElementById("bookingForm");

        const validators = {
            name: {
                test: value => /^[A-Za-z ]+$/.test(value.trim()),
                message: "Name must contain alphabets only."
            },
            email: {
                test: value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
                message: "Enter a valid email address."
            },
            seats: {
                test: value => /^\d+$/.test(value) && Number(value) >= 1 && Number(value) <= 10,
                message: "Seats must be a whole number from 1 to 10."
            }
        };

        function validateField(fieldName) {
            const input = document.getElementById(fieldName);
            const error = document.getElementById(fieldName + "Error");
            const isValid = validators[fieldName].test(input.value);

            input.classList.toggle("valid", isValid);
            input.classList.toggle("invalid", !isValid);
            error.textContent = isValid ? "" : validators[fieldName].message;

            return isValid;
        }

        Object.keys(validators).forEach(fieldName => {
            document.getElementById(fieldName).addEventListener("input", () => {
                validateField(fieldName);
            });
        });

        form.addEventListener("submit", event => {
            event.preventDefault();

            const isValid = Object.keys(validators)
                .map(validateField)
                .every(Boolean);

            if (!isValid) {
                document.getElementById("ticket").textContent = "";
                return;
            }

            const booking = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                seats: Number(document.getElementById("seats").value)
            };

            document.getElementById("ticket").textContent =
                `Booking Confirmed\nName: ${booking.name}\nEmail: ${booking.email}\nSeats: ${booking.seats}`;

            console.log(booking);
        });
    </script>
</body>
</html>
