<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Jaipur</option>
        <option>Goa</option>
        <option>Kochi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Vrindavan</option>
        <option>Taj Mahal</option>
        <option>Goa Beach</option>
        <option>Kerala Backwaters</option>
    </select>

    <br><br>

    <p>
        My selected destination is India, Uttar Pradesh, Mathura,
        and my favorite tourist place is Vrindavan.
    </p>

</body>
</html>
