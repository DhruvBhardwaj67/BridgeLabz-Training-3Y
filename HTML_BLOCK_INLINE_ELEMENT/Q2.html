<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

    <header>
        <h1>Online Product Catalog</h1>
    </header>

    <main>
        <table border="1">
            <tr>
                <th colspan="5">Product Catalog</th>
            </tr>

            <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>

            <tr>
                <td>
                    <img src="https://via.placeholder.com/100" alt="Laptop">
                </td>
                <td>Laptop</td>
                <td>High-performance laptop for students.</td>
                <td>₹50,000</td>
                <td rowspan="2">In Stock</td>
            </tr>

            <tr>
                <td>
                    <img src="https://via.placeholder.com/100" alt="Headphones">
                </td>
                <td>Headphones</td>
                <td>Wireless noise-cancelling headphones.</td>
                <td>₹2,500</td>
            </tr>

            <tr>
                <td>
                    <img src="https://via.placeholder.com/100" alt="Keyboard">
                </td>
                <td>Keyboard</td>
                <td>Mechanical gaming keyboard.</td>
                <td>₹1,800</td>
                <td>Out of Stock</td>
            </tr>
        </table>
    </main>

</body>
</html>
