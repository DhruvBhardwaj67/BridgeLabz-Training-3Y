<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login Form</h1>

    <form action="#" method="post">

        <!-- Username -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!--
        CSRF token helps protect a website from Cross-Site Request Forgery attacks
        by verifying that the request comes from an authorized form.
        -->
        <input type="hidden" name="csrf_token" value="dummy12345">

        <input type="submit" value="Login">

    </form>

</body>
</html>
