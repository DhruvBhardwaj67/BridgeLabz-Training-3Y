<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>GLA University, Mathura</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible on the screen. -->
    <iframe
        src="https://www.google.com/maps?q=GLA%20University%20Mathura&output=embed"
        title="Google Map showing GLA University Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
